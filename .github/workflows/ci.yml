name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - name: Configure
        run: ./autogen.sh && ./configure
      - name: Build
        run: make
      - name: Test
        run: make check
