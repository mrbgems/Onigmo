name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - name: Configure
        run: ./autogen.sh && ./configure
      - name: Build
        run: make
      - name: Test
        run: make test

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool ruby
      - name: Configure with AddressSanitizer
        run: |
          ./autogen.sh
          ./configure CC=gcc CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address" LDFLAGS="-fsanitize=address"
      - name: Build
        run: make
      - name: Test
        # The Python test driver loads the sanitized library, so libasan must
        # come first; leak detection is off because Python leaks at exit.
        run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=0 make test
